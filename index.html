<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Mis Herramientas</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="noise"></div>
  <div class="grid-bg"></div>

  <header class="site-header">
    <div class="header-left">
      <span class="logo-mark">◈</span>
      <div>
        <div class="site-label">MIS HERRAMIENTAS</div>
        <div class="site-tagline">Panel de control personal</div>
      </div>
    </div>
    <div class="header-right">
      <div class="clock" id="clock">00:00:00</div>
      <div class="date-display" id="dateDisplay">—</div>
    </div>
  </header>

  <main class="main-content">

    <section class="section-intro">
      <div class="intro-number">01</div>
      <div class="intro-text">
        <h2 class="intro-heading">Herramientas activas</h2>
        <p class="intro-sub">Selecciona una app para abrirla</p>
      </div>
      <div class="intro-count" id="toolCount">0 apps</div>
    </section>

    <div class="tools-grid" id="toolsGrid"></div>

    <section class="section-divider">
      <span class="divider-label">ACCESO RÁPIDO</span>
      <div class="divider-line"></div>
    </section>

    <div class="quick-bar" id="quickBar"></div>

  </main>

  <footer class="site-footer">
    <span>Panel personal · <span id="year"></span></span>
    <span class="footer-mark">Hecho a mano ✦</span>
  </footer>

  <script src="main.js"></script>
</body>
</html>
